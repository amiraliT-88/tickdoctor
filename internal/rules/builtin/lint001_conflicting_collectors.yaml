id: LINT-001
title: Conflicting Garbage Collectors Specified
severity: CRITICAL
collector: All
condition_type: conflicting_collectors
threshold: 2
recommendation: keep only one collector flag (prefer -XX:+UseG1GC on Java 17+)
explanation: Multiple mutually exclusive garbage collectors were specified in the startup flags. The JVM will either exit with an error on boot or silently fall back to the last argument.
doc_url: https://docs.oracle.com/en/java/javase/21/gctuning/ergonomics.html
