id: ZGC-001
title: ZGC Allocation Stall Detected
severity: WARNING
collector: ZGC
condition_type: zgc_allocation_stall
threshold: 1
recommendation: increase -Xmx or add -XX:ConcGCThreads
explanation: Mutator threads ran out of available memory faster than concurrent ZGC workers could reclaim it, inducing thread stalls.
doc_url: https://docs.oracle.com/en/java/javase/21/gctuning/z-garbage-collector.html
